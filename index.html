<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเชื่อมต่อ Google Sheets</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>ฝากข้อมูลลง Google Sheets</h2>

  <div class="form-group">
    <label for="scriptUrl">Google Apps Script URL:</label>
    <!-- นำ URL ของคุณใส่ไว้ใน value พร้อมใช้งานทันที -->
    <input 
      type="text" 
      id="scriptUrl" 
      value="https://script.google.com/macros/s/AKfycbyUe0h-NFneOe1RkAx42pevjhFpJ96Id3oOsQJ5P8L7of9iX1EU8BTbvbMdtLf-GK9g/exec" 
      readonly
    />
  </div>

  <div class="form-group">
    <label for="dataInput">ข้อมูลที่ต้องการส่ง:</label>
    <input type="text" id="dataInput" placeholder="กรอกข้อความที่นี่...">
  </div>

  <button onclick="sendData()">ส่งข้อมูล</button>

  <p id="status"></p>

  <script>
    // ดึง URL มาใช้งานใน JavaScript
    const SCRIPT_URL = document.getElementById('scriptUrl').value;

    function sendData() {
      const inputVal = document.getElementById('dataInput').value;
      const statusText = document.getElementById('status');

      if (!inputVal) {
        alert('กรุณากรอกข้อมูลก่อนส่ง');
        return;
      }

      statusText.innerText = 'กำลังส่งข้อมูล...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // ป้องกันติด CORS เมื่อเรียกข้ามโดเมน
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ message: inputVal })
      })
      .then(() => {
        statusText.innerText = 'ส่งข้อมูลสำเร็จเรียบร้อย!';
        document.getElementById('dataInput').value = '';
      })
      .catch(error => {
        console.error('Error:', error);
        statusText.innerText = 'เกิดข้อผิดพลาดในการส่งข้อมูล';
      });
    }
  </script>

</body>
</html>
